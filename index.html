<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CHANGE THIS: Your Custom Site Title -->
    <title>CLUTCH! An Axe Thrower's Guide to Making Change Stick</title>
    <style>
        /* CSS VARIABLES: Change colors and styling here */
        :root {
            /* CHANGE THIS: Tweak your color palette to adjust the vibe */
            --bg-color: #0b131a;         /* Deep moody dark blue/gray */
            --card-bg: #12202b;          /* Slightly lighter slate for container */
            --aqua-teal: #0df;           /* Glowing primary aqua teal */
            --aqua-glow: rgba(0, 221, 255, 0.2);
            --text-primary: #e2f1f5;     /* High contrast off-white */
            --text-muted: #8fa0a6;       /* Subtle lavender-gray */
            --border-color: #203545;     /* Soft border */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, Avenir, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.5;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--aqua-glow);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* CHANGE THIS: Adjust site title style */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--aqua-teal);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        
        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 1.5rem 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>An Axe Thrower's Guide to Change that Sticks</h1>
            <!-- CHANGE THIS: Supporting Subtitle -->
            <p class="subtitle">TK subtitle</p>
            <!-- LEAVE OR CHANGE: Link explaining the conceptual backing -->
            <a href="https://urbanaxesboston.com/" target="_blank" class="triangle-link">
                Learn about Urban Axes Boston ↗
            </a>
        </header>
        <footer>
            <!-- CHANGE THIS: Simple footer/commit info -->
            Commit #1 • Built for reflection.
        </footer>
    </div>

</body>
</html>
